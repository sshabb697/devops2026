<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Segoe UI, sans-serif" font-size="13">
  <rect width="720" height="200" fill="#f8fafc"/>
  <circle cx="120" cy="100" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="104" text-anchor="middle" font-weight="bold">VPC1</text>
  <circle cx="360" cy="100" r="48" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="104" text-anchor="middle" font-weight="bold">VPC2</text>
  <circle cx="600" cy="100" r="48" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="104" text-anchor="middle" font-weight="bold">VPC3</text>
  <line x1="168" y1="100" x2="312" y2="100" stroke="#16a34a" stroke-width="3"/>
  <text x="240" y="88" text-anchor="middle" fill="#166534">peered</text>
  <line x1="408" y1="100" x2="552" y2="100" stroke="#16a34a" stroke-width="3"/>
  <text x="480" y="88" text-anchor="middle" fill="#166534">peered</text>

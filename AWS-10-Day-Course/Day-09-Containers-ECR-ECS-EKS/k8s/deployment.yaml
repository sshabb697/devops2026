apiVersion: apps/v1
kind: Deployment
metadata:
  name: class-app
  labels:
    app: class-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: class-app
  template:
    metadata:
      labels:
        app: class-app
    spec:
      containers:
        - name: web
          # Replace ACCOUNT and REGION with your values after pushing to ECR.
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/class-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: class-app
spec:
  type: LoadBalancer
  selector:
    app: class-app
  ports:
    - port: 80
      targetPort: 80
